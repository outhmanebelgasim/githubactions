name: Continous integration Workflow 

on: 
    pull_request: 
        branches: main

defaults: 
    run:
        shell: bash
        working-directory: ./web

jobs: 
    test: 
        name: "Run unit tests"
        runs-on: ubuntu-latest
        steps: 
            - name: "checkout repository"
              uses: actions/checkout@v7
              
            
            - name: 'Install dependencies'
              run: npm install 
            
            - name: 'Run tests'
              run: npm run test
    
    lint: 
        name: "Run linter"
        runs-on: ubuntu-latest
        steps: 
            - name: "Checkout repository"
              uses: actions/checkout@v7
            
            - name: "install dependencies"
              run: npm install 

            - name: "Run Linter" 
              run: npx standard -v

